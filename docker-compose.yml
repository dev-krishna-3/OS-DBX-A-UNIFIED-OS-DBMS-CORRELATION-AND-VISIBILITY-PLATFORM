services:
  db:
    image: mysql:8.0
    container_name: os-dbx-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Admin@OSDBX2026!
      MYSQL_DATABASE: os_dbx
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pAdmin@OSDBX2026!"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: os-dbx-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_NAME: "OS-DBX Unified Platform"
      ENVIRONMENT: production
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: Admin@OSDBX2026!
      MYSQL_DATABASE: os_dbx
      EVENT_STORAGE: mysql
      ADMIN_PASSWORD: Admin@OSDBX2026!
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: os-dbx-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  mysql_data:
