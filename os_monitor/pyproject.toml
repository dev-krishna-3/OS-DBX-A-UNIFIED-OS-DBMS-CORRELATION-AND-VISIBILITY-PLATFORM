[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "osdbx-os-collector"
version = "1.0.0"
description = "OS event collector and adapter for the OS-DBX platform"
requires-python = ">=3.10"
dependencies = [
    "psutil>=5.9",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["os_monitor*", "osdbx*"]
